name: Check PR commit messages

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const commitPattern = /^\s*(fix|feat|docs|test|refactor)<#\d+>:\s+\S.*$/;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    commits(first: 100, after: $cursor) {
                      nodes {
                        commit {
                          oid
                          messageHeadline
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const commits = [];
            let cursor = null;

            do {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: context.issue.number,
                cursor,
              });
              const page = result.repository.pullRequest.commits;
              commits.push(...page.nodes.map(({ commit }) => commit));
              cursor = page.pageInfo.hasNextPage
                ? page.pageInfo.endCursor
                : null;
            } while (cursor);

            const invalidCommits = commits.filter(
              ({ messageHeadline }) => !commitPattern.test(messageHeadline)
            );

            if (invalidCommits.length > 0) {
              const details = invalidCommits
                .map(
                  ({ oid, messageHeadline }) =>
                    `- ${oid.slice(0, 7)} ${messageHeadline}`
                )
                .join('\n');

              core.setFailed(
                'Commit messages must match type<#issue>: description, using fix, feat, docs, test, or refactor and an issue number such as <#123>.\n' +
                  details
              );
            }
